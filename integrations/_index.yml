# FIWARE integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in fiware-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: fiware-red-hat-ecosystem-catalog-certified-partners
  label: Red Hat Ecosystem Catalog (certified partners)
  partner: red-hat
  partner_name: Red Hat Ecosystem Catalog (certified partners)
  category: Red Hat OpenShift / RHEL software certification
  type: register
  channel: standard-directory
  evidence: https://catalog.redhat.com/software/containers/search?p=1&vendor_name=FIWARE%20FOUNDATION%20E%20V
  source: edge
  relationship: standard-participant
  contract_reference:
    register: 'Red Hat Ecosystem Catalog (catalog.redhat.com/api/containers/v1: repositories, vendors, certified
      operator bundles)'
    standard: Red Hat Container Certification (Red Hat Ecosystem Catalog, registry.connect.redhat.com)
    spec_file: null
    role: red-hat-certified-partner
    registered_name: FIWARE FOUNDATION E V
    register_id: fiware
    matched_domain: fiware.org
    matched_by: domain
    identity_source: the register's own company_url for the vendor (no lookup)
    certified_products:
    - product: Red Hat certified container image
      product_type: container-image
      standard: Red Hat Container Certification (Red Hat Ecosystem Catalog, registry.connect.redhat.com)
      lapsed: false
      repositories_listed: 1
      products_sample:
      - fiware/orion-ld
    signal_note: 'certified_products = one entry per certified product TYPE (container image, OpenShift operator),
      standard named on each; lapsed: true when no certified item of that type is current (containers: all Deprecated
      / past EOL / unpublished; operators: absent from the three newest certified-operator indexes); repository
      and package counts are context, never counted'
    detected_by: sweep-red-hat-certified-ecosystem.py
    detected: '2026-10-22'
  status: not-a-workflow
  arazzo: null
